services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  loader:
    build:
      context: .
      dockerfile: loader/Dockerfile
    env_file: .env
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    env_file: .env
    depends_on:
      loader:
        condition: service_completed_successfully

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    ports:
      - "8502:8501"
    volumes:
      - ./measure/results:/results
    depends_on:
      pipeline:
        condition: service_completed_successfully

  # Not started by `docker compose up` (see "tools" profile). Run on demand:
  #   docker compose run --rm measure
  measure:
    build:
      context: .
      dockerfile: measure/Dockerfile
    env_file: .env
    profiles: ["tools"]
    volumes:
      - ./data:/data:ro
      - ./measure/results:/results
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
